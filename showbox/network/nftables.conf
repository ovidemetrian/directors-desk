#!/usr/sbin/nft -f
# Director's Desk · SHOW BOX firewall (NUC). Two ports in, nothing routed, nothing else.
#   show LAN (Wi-Fi router side)  : enp1s0  192.168.50.10/24  → tablet + phones reach 8443 (HTTPS) and 8080 (certificate step)
#   Core LAN (cable to the Core)  : enp2s0  192.168.60.10/24  → the box calls the Core on 1710; the Core cannot call in
# Interface names: check yours with `ip link` and change the two lines below.
flush ruleset
define SHOW = enp1s0
define CORE = enp2s0

table inet showbox {
  chain input {
    type filter hook input priority 0; policy drop;
    iif lo accept
    ct state established,related accept
    ct state invalid drop
    iifname $SHOW ip saddr 192.168.50.0/24 tcp dport { 8443, 8080 } accept   # the desk, the radio, the trust step
    iifname $SHOW ip saddr 192.168.50.0/24 udp dport 123 accept              # show clock (chrony)
    iifname $SHOW ip saddr 192.168.50.0/24 icmp type echo-request accept     # ping, for setup
    # iifname $SHOW ip saddr 192.168.50.0/24 tcp dport 22 accept             # SSH for maintenance: open only when needed
  }
  chain forward {
    type filter hook forward priority 0; policy drop;                         # phones can never reach the Core through the box
  }
  chain output {
    type filter hook output priority 0; policy accept;
  }
}
